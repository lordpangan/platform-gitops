# XNetwork — the network layer API (a shared VPC).
# Crossplane v2 namespaced XRD (scope: Namespaced): the XR *is* the claim.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xnetworks.platform.meridian.io
spec:
  scope: Namespaced
  group: platform.meridian.io
  names:
    kind: XNetwork
    plural: xnetworks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              x-kubernetes-validations:
                - rule: "self.mode == oldSelf.mode"
                  message: "mode is immutable (it selects the CIDR preset)"
                - rule: "!has(oldSelf.cidr) || (has(self.cidr) && self.cidr == oldSelf.cidr)"
                  message: "cidr can be set once, then never changed or removed"
                - rule: "!has(oldSelf.azCount) || (has(self.azCount) && self.azCount >= oldSelf.azCount)"
                  message: "azCount can only grow"
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum: [dev, prd]
                  description: >-
                    Mode preset for network config (dev/prd). 
                    Any explicitly-set spec.* field overrides 
                    the preset via `| default` (explicit beats preset).
                cidr:
                  type: string
                  description: VPC CIDR block. Override for peering / non-overlap.
                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                azCount:
                  type: integer
                  minimum: 2
                  description: Availability Zones to spread across (minimum 2 — EKS needs >=2 subnets).
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: Extra tags merged onto every resource in the network.
            status:
              type: object
              properties:
                vpcId:
                  type: string
                  description: The provisioned VPC id (set from the Workspace output).
