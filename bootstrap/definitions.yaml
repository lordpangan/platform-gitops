apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-definitions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lordpangan/platform-gitops.git
    path: definitions
    targetRevision: main
    directory:
      recurse: true
      exclude: '*/backstage-template.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # No prune. Deleting a Composition deletes every revision it owns, and
    # claims pinned to those releases stop. Deleting an XRD deletes every claim
    # of its kind. A removed file leaves the object in place (OutOfSync); delete
    # it by hand on purpose. See bootstrap/README.md.
    automated: { prune: false, selfHeal: true }