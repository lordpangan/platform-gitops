apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-definitions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lordpangan/platform-gitops.git
    path: definitions
    targetRevision: main
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }